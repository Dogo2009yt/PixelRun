<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lab INFO — Programmazione a blocchi</title>
<style>
:root{--bg:#0b1220;--panel:#121d30;--panel2:#17253b;--line:#2c3d57;--text:#eef5ff;--muted:#a9bad0;--cyan:#55d7e8;--yellow:#ffd166;--green:#79e0a1;--red:#ff7c86}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#172a45 0,#0b1220 60%);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{padding:26px 22px 18px;max-width:1200px;margin:auto}header .eyebrow{color:var(--cyan);font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase}h1{margin:.25rem 0;font-size:clamp(1.7rem,4vw,2.7rem);line-height:1.1}header p{display:none}.layout{max-width:1200px;margin:auto;padding:0 22px 30px;display:grid;grid-template-columns:minmax(280px,.9fr) minmax(330px,1.1fr);gap:16px}.panel{background:linear-gradient(160deg,#152238,#101a2b);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0;box-shadow:0 12px 32px #0002}.panel h2{font-size:1.08rem;margin:0 0 10px}.muted{color:var(--muted);font-size:.92rem}.toolbox{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.btn{border:1px solid #405774;background:#1b2b43;color:var(--text);border-radius:10px;padding:10px 11px;font:inherit;font-weight:700;cursor:pointer;transition:.15s}.btn:hover{border-color:var(--cyan);transform:translateY(-1px)}.btn:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}.btn.primary{background:var(--cyan);border-color:var(--cyan);color:#09202b}.btn.subtle{background:transparent}.btn.warn{border-color:#8d515b;color:#ffdfe2}.tool{display:flex;align-items:center;gap:8px;text-align:left}.symbol{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:7px;background:#ffffff12;font-size:1.1rem}.hint{border-left:3px solid var(--yellow);padding:9px 12px;background:#ffd16612;border-radius:0 9px 9px 0;color:#f7e7bc;font-size:.9rem;margin-top:14px}.program{display:flex;flex-direction:column;gap:8px;min-height:155px}.empty{padding:22px 12px;text-align:center;color:var(--muted);border:1px dashed #40516a;border-radius:12px}.block{border-radius:11px;padding:9px 10px;display:flex;align-items:center;gap:8px;border:1px solid #4c6787;background:#203b58}.block[draggable="true"]{cursor:grab}.block[draggable="true"]:active{cursor:grabbing}.block.dragging{opacity:.4}.program.drag-over{outline:2px dashed var(--cyan);outline-offset:5px}.block.drop-target{outline:2px dashed var(--yellow)}.cell.robot{will-change:transform}.block.move{border-left:5px solid #58d6e8}.block.turn{border-left:5px solid #b49aff}.block.collect{border-left:5px solid #79e0a1}.block.loop{display:block;border:2px solid #e8bd54;background:#332e25}.blocktop{display:flex;align-items:center;gap:8px}.blocktop strong{flex:1}.block small{color:var(--muted)}.block .mini{padding:3px 7px;font-size:.85rem;border-radius:7px}.nested{margin:9px 0 0 13px;padding:9px;border-left:3px solid #e8bd54;display:flex;flex-direction:column;gap:7px}.nested .block{background:#1d3046}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.world{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:14px 0}.cell{aspect-ratio:1;border-radius:8px;background:#1d3046;border:1px solid #304764;display:grid;place-items:center;position:relative;font-weight:800;font-size:clamp(.8rem,2vw,1.2rem)}.cell.wall{background:#263248;border-color:#36455c}.cell.path{background:#203b45}.cell.start{outline:2px solid var(--cyan)}.cell.robot{background:#d9f8ff;color:#09202b;box-shadow:0 0 18px #55d7e866}.cell.robot span{font-size:1.55rem}.cell.got{background:#174b3b;border-color:#79e0a1;color:#b6ffd0}.legend{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.82rem}.legend span{display:flex;align-items:center;gap:5px}.dot{width:10px;height:10px;border-radius:3px;display:inline-block}.status{padding:11px 12px;border-radius:10px;background:#0b1524;border:1px solid var(--line);min-height:48px;color:var(--muted)}.status.good{color:var(--green);border-color:#347956}.status.bad{color:#ffb5bb;border-color:#874b55}.lesson{display:grid;gap:10px}.lesson article{padding:11px 12px;background:#0e1929;border:1px solid #273a54;border-radius:12px}.lesson h3{font-size:.96rem;margin:0 0 4px;color:var(--cyan)}.lesson p{margin:0;color:#d4e0ee;font-size:.9rem}.lesson code{color:var(--yellow);font-weight:700}.footer{max-width:1200px;margin:auto;padding:0 22px 28px;color:var(--muted);font-size:.85rem}.counter{color:var(--yellow);font-weight:800}.smalllabel{font-size:.8rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.08em}.selectrow{display:flex;align-items:center;gap:8px}.selectrow select{background:#0c1726;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px;font:inherit}@media(max-width:950px){.layout{grid-template-columns:1fr 1fr}}@media(max-width:650px){.layout{grid-template-columns:1fr;padding:0 12px 24px}header{padding:18px 14px}.panel{padding:14px}.cell{border-radius:5px;gap:2px}}
</style></head><body>
<header><div class="eyebrow">Codice Rosso · Lab INFO</div><h1>🤖 Pixel</h1></header>
<main class="layout">
<section class="panel"><h2>Blocchi</h2><div class="toolbox">
<button class="btn tool" draggable="true" data-add="forward"><span class="symbol">⬆️</span>Avanti</button><button class="btn tool" draggable="true" data-add="right"><span class="symbol">↪️</span>Gira a destra</button><button class="btn tool" draggable="true" data-add="left"><span class="symbol">↩️</span>Gira a sinistra</button><button class="btn tool" draggable="true" data-add="collect"><span class="symbol">✋</span>Raccogli</button><button class="btn tool" draggable="true" data-add="loop" style="grid-column:1/-1"><span class="symbol">🔁</span>Aggiungi ciclo</button></div><h2 style="margin-top:20px">Programma</h2><div class="program" id="program" aria-live="polite"></div><div class="controls"><button class="btn primary" id="run">▶ Esegui</button><button class="btn" id="step">Un passo</button><button class="btn subtle" id="reset">↺ Ripristina</button><button class="btn warn" id="clear">Svuota</button></div><div class="selectrow"><label for="loopCount" class="muted">Nuovi cicli:</label><select id="loopCount"><option value="2">ripeti 2 volte</option><option value="3" selected>ripeti 3 volte</option><option value="4">ripeti 4 volte</option><option value="5">ripeti 5 volte</option></select></div></section>
<section class="panel"><h2>Labirinto</h2><div class="world" id="world" role="img" aria-label="Griglia del percorso di Pixel"></div><div class="status" id="status" aria-live="polite">Pronto.</div><p class="muted"><span id="count">0</span> · <span id="letters">—</span></p></section>

</main>
<script>
const programEl=document.getElementById('program'),worldEl=document.getElementById('world'),statusEl=document.getElementById('status');let program=[],robot={x:0,y:6,dir:0},collected=[],queue=[],cursor=0,steps=0,running=false;const letters=[{x:3,y:3,ch:'A'}];const dirs=[[0,-1],[1,0],[0,1],[-1,0]];const names={forward:['⬆️','Avanti'],right:['↪️','Gira a destra'],left:['↩️','Gira a sinistra'],collect:['✋','Raccogli']};
function makeBlock(type){if(type==='loop')return {type:'loop',n:+document.getElementById('loopCount').value,children:[{type:'forward'},{type:'forward'}]};return {type};}
function add(type){program.push(makeBlock(type));renderProgram();resetWorld(false)}
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>add(b.dataset.add)));
// Drag-and-drop: trascina dalla cassetta degli attrezzi per aggiungere, oppure riordina blocchi dello stesso contenitore.
let draggedTool=null, draggedBlock=null;
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('dragstart',e=>{
 draggedTool=b.dataset.add; draggedBlock=null;
 e.dataTransfer.effectAllowed='copy'; e.dataTransfer.setData('text/plain','tool:'+draggedTool);
}));
programEl.addEventListener('dragover',e=>{if(draggedTool||draggedBlock){e.preventDefault();programEl.classList.add('drag-over')}});
programEl.addEventListener('dragleave',e=>{if(!programEl.contains(e.relatedTarget))programEl.classList.remove('drag-over')});
programEl.addEventListener('drop',e=>{
 e.preventDefault(); programEl.classList.remove('drag-over');
 if(draggedTool){add(draggedTool);draggedTool=null;return}
});
programEl.addEventListener('dragstart',e=>{
 const block=e.target.closest('[data-drag-index]');
 if(!block)return;
 draggedBlock={index:+block.dataset.dragIndex,parent:block.dataset.dragParent};
 block.classList.add('dragging'); e.dataTransfer.effectAllowed='move';
 e.dataTransfer.setData('text/plain','block');
});
programEl.addEventListener('dragend',()=>{
 programEl.querySelectorAll('.dragging,.drop-target').forEach(el=>el.classList.remove('dragging','drop-target'));
 draggedBlock=null;draggedTool=null;programEl.classList.remove('drag-over');
});
programEl.addEventListener('dragover',e=>{
 const target=e.target.closest('[data-drag-index]');
 if(draggedBlock&&target){e.preventDefault();programEl.querySelectorAll('.drop-target').forEach(el=>el.classList.remove('drop-target'));target.classList.add('drop-target')}
});
programEl.addEventListener('drop',e=>{
 const target=e.target.closest('[data-drag-index]');
 if(!draggedBlock||!target)return;
 e.preventDefault();e.stopPropagation();
 const from=draggedBlock, to={index:+target.dataset.dragIndex,parent:target.dataset.dragParent};
 if(from.parent===to.parent&&from.index!==to.index){
  const list=from.parent==='root'?program:program[+from.parent].children;
  const [item]=list.splice(from.index,1);list.splice(to.index,0,item);
  renderProgram();resetWorld(false);
 }
 draggedBlock=null;
});

function blockHTML(item,index,parent){if(item.type==='loop'){return `<div class="block loop" draggable="true" data-drag-index="${index}" data-drag-parent="${parent}"><div class="blocktop"><span>🔁</span><strong>Ripeti <select class="mini loop-n" data-index="${index}" data-parent="${parent}" aria-label="Numero di ripetizioni">${[2,3,4,5].map(n=>`<option ${item.n===n?'selected':''}>${n}</option>`).join('')}</select> volte</strong><button class="btn mini" data-action="up" data-index="${index}" data-parent="${parent}" aria-label="Sposta su">↑</button><button class="btn mini" data-action="down" data-index="${index}" data-parent="${parent}" aria-label="Sposta giù">↓</button><button class="btn mini warn" data-action="remove" data-index="${index}" data-parent="${parent}" aria-label="Rimuovi ciclo">×</button></div><small>Questi comandi vengono ripetuti insieme:</small><div class="nested">${item.children.map((c,j)=>blockHTML(c,j,index)).join('')}<button class="btn mini" data-action="child-forward" data-index="${index}">+ Avanti</button><button class="btn mini" data-action="child-right" data-index="${index}">+ Gira a destra</button><button class="btn mini" data-action="child-left" data-index="${index}">+ Gira a sinistra</button><button class="btn mini" data-action="child-collect" data-index="${index}">+ Raccogli</button></div></div>`}let [icon,label]=names[item.type];return `<div class="block ${item.type==='collect'?'collect':item.type==='forward'?'move':'turn'}" draggable="true" data-drag-index="${index}" data-drag-parent="${parent}"><span>${icon}</span><strong>${label}</strong><button class="btn mini" data-action="up" data-index="${index}" data-parent="${parent}" aria-label="Sposta su">↑</button><button class="btn mini" data-action="down" data-index="${index}" data-parent="${parent}" aria-label="Sposta giù">↓</button><button class="btn mini warn" data-action="remove" data-index="${index}" data-parent="${parent}" aria-label="Rimuovi blocco">×</button></div>`}
function renderProgram(){if(!program.length){programEl.innerHTML='<div class="empty">Nessun blocco ancora.<br>Comincia da «Avanti» oppure prova un ciclo.</div>';return}programEl.innerHTML=program.map((b,i)=>blockHTML(b,i,'root')).join('');programEl.querySelectorAll('[data-action]').forEach(btn=>btn.addEventListener('click',()=>{let i=+btn.dataset.index,p=btn.dataset.parent==='root'?program:program[+btn.dataset.parent].children,act=btn.dataset.action;if(act==='remove')p.splice(i,1);if(act==='up'&&i>0)[p[i-1],p[i]]=[p[i],p[i-1]];if(act==='down'&&i<p.length-1)[p[i+1],p[i]]=[p[i],p[i+1]];if(act.startsWith('child-'))program[i].children.push({type:act.slice(6)});renderProgram();resetWorld(false)}));programEl.querySelectorAll('.loop-n').forEach(s=>s.addEventListener('change',()=>{let p=s.dataset.parent==='root'?program:program[+s.dataset.parent].children;p[+s.dataset.index].n=+s.value;resetWorld(false)}))}
function flatten(list){let out=[];list.forEach(b=>{if(b.type==='loop'){for(let n=0;n<b.n;n++)out=out.concat(flatten(b.children))}else out.push(b.type)});return out}
function renderWorld(){const oldRobot=worldEl.querySelector('.cell.robot');const oldRect=oldRobot?oldRobot.getBoundingClientRect():null;worldEl.innerHTML='';for(let y=0;y<7;y++)for(let x=0;x<7;x++){let c=document.createElement('div');c.className='cell '+((x+y)%2?'path':'');let letter=letters.find(l=>l.x===x&&l.y===y);if(letter)c.textContent=collected.includes(letter.ch)?'✓':letter.ch;if(collected.includes(letter?.ch))c.classList.add('got');if(robot.x===x&&robot.y===y){c.classList.add('robot');c.innerHTML='<span>'+['⬆️','➡️','⬇️','⬅️'][robot.dir]+'</span>'}worldEl.appendChild(c)}const newRobot=worldEl.querySelector('.cell.robot');if(oldRect&&newRobot){const newRect=newRobot.getBoundingClientRect(),dx=oldRect.left-newRect.left,dy=oldRect.top-newRect.top;if(dx||dy){newRobot.animate([{transform:`translate(${dx}px,${dy}px) scale(.92)`},{transform:'translate(0,0) scale(1)'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'})}}}
function resetWorld(message=true){robot={x:0,y:6,dir:0};collected=[];queue=flatten(program);cursor=0;steps=0;running=false;document.getElementById('count').textContent='0';document.getElementById('letters').textContent='—';renderWorld();if(message)show('Percorso ripristinato. Pronto per una nuova prova.');else show('Programma aggiornato. Premi «Esegui» per provarlo.')}
function show(msg,type=''){statusEl.className='status '+type;statusEl.textContent=msg}
function executeOne(){if(cursor>=queue.length){running=false;if(collected.includes('A'))show('Ottimo! Pixel ha raggiunto e raccolto la lettera A. Ora prova a ottenere lo stesso risultato con meno blocchi.','good');else show('Programma terminato. Pixel non ha ancora raccolto A: modifica i blocchi e riprova.');return false}let cmd=queue[cursor++];steps++;if(cmd==='forward'){let nx=robot.x+dirs[robot.dir][0],ny=robot.y+dirs[robot.dir][1];if(nx<0||nx>6||ny<0||ny>6){show('Pixel sta per uscire dalla griglia: cambia il programma o gira prima.','bad');running=false;return false}robot.x=nx;robot.y=ny}else if(cmd==='right')robot.dir=(robot.dir+1)%4;else if(cmd==='left')robot.dir=(robot.dir+3)%4;else if(cmd==='collect'){let l=letters.find(l=>l.x===robot.x&&l.y===robot.y);if(l&&!collected.includes(l.ch)){collected.push(l.ch);show('Hai raccolto la lettera '+l.ch+'!','good')}else show('Qui non c’è nessuna lettera da raccogliere.');}document.getElementById('count').textContent=steps;document.getElementById('letters').textContent=collected.join(', ')||'—';renderWorld();if(cursor>=queue.length){running=false;if(collected.includes('A'))show('Ottimo! Pixel ha raggiunto e raccolto la lettera A.','good');else show('Programma terminato. Pixel non ha ancora raccolto A: modifica i blocchi e riprova.')}return true}
async function runAll(){if(running)return;resetWorld(false);queue=flatten(program);if(!queue.length){show('Aggiungi almeno un blocco prima di eseguire.');return}running=true;let guard=0;while(running&&guard++<200){const did=executeOne();if(!did)break;if(running)await new Promise(resolve=>setTimeout(resolve,380))}if(guard>=200){running=false;show('Programma troppo lungo: prova a semplificarlo.','bad')}}
document.getElementById('run').addEventListener('click',runAll);document.getElementById('step').addEventListener('click',()=>{if(running)return;if(cursor===0)queue=flatten(program);if(!queue.length){show('Aggiungi almeno un blocco prima di iniziare.');return}running=true;executeOne()});document.getElementById('reset').addEventListener('click',()=>resetWorld());document.getElementById('clear').addEventListener('click',()=>{program=[];renderProgram();resetWorld(false)});renderProgram();resetWorld(false);
</script></body></html>
